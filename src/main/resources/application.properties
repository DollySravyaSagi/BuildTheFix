# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=BuildTheFix

# Database Configuration (Defaults to H2 in-memory if PostgreSQL env variables are not set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:buildthefixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Enabled for easy debugging in H2 mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Third Party Integrations Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

stripe.api.key=${STRIPE_SECRET_KEY:}
